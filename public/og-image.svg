<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Right side: profile photo clipped to square with rounded corners -->
  <defs>
    <clipPath id="pfp-clip">
      <rect x="720" y="65" width="430" height="500" rx="12"/>
    </clipPath>
    <!-- Fade gradient on left edge of photo so it blends into bg -->
    <linearGradient id="photo-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="1"/>
      <stop offset="30%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <image href="https://drlove.dev/pfp.png" x="720" y="65" width="430" height="500" clip-path="url(#pfp-clip)" preserveAspectRatio="xMidYMid slice"/>
  <!-- Blend overlay so photo fades into dark bg on the left -->
  <rect x="720" y="65" width="180" height="500" fill="url(#photo-fade)"/>
  <!-- Subtle border around photo -->
  <rect x="720" y="65" width="430" height="500" rx="12" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="80" y="160" width="3" height="300" fill="#e87c3a" opacity="0.6"/>

  <!-- Eyebrow label -->
  <text x="104" y="192" font-family="monospace" font-size="13" fill="#e87c3a" letter-spacing="3">SUDIP ROY · DRLOVE</text>

  <!-- Main heading -->
  <text x="104" y="290" font-family="monospace" font-weight="700" font-size="66" fill="#e8e4dc" letter-spacing="-1">I build systems</text>
  <text x="104" y="368" font-family="monospace" font-weight="700" font-size="66" fill="#888888" letter-spacing="-1">people live inside.</text>

  <!-- Tagline -->
  <text x="104" y="430" font-family="serif" font-size="20" fill="#b0aba3">Systems engineer · West Bengal, India</text>

  <!-- Stats row -->
  <text x="104" y="504" font-family="monospace" font-size="16" fill="#e87c3a">50k+</text>
  <text x="104" y="524" font-family="monospace" font-size="11" fill="#666666">Server Members</text>

  <line x1="220" y1="492" x2="220" y2="532" stroke="#2a2a2a" stroke-width="1"/>

  <text x="240" y="504" font-family="monospace" font-size="16" fill="#e87c3a">5 yrs</text>
  <text x="240" y="524" font-family="monospace" font-size="11" fill="#666666">In Production</text>

  <line x1="380" y1="492" x2="380" y2="532" stroke="#2a2a2a" stroke-width="1"/>

  <text x="400" y="504" font-family="monospace" font-size="16" fill="#e87c3a">6</text>
  <text x="400" y="524" font-family="monospace" font-size="11" fill="#666666">Database Systems</text>

  <!-- Domain bottom right -->
  <text x="690" y="600" font-family="monospace" font-size="15" fill="#e87c3a" text-anchor="end">drlove.dev</text>
</svg>
